<!DOCTYPE html>
<html lang="pt-BR">

<head>

<body>

    <main>

        <section id="pagina-generos">

<p>Uma seleção de sertanejo pra quem já sofreu, sofre ou vai sofrer.</p>

<div id="playlist-spotify">

    <a href="https://open.spotify.com/playlist/6hTvLKwIB7RmeMZRwsneAy"

        </div>

        <span>▶</span>

    </a>

</div>

<div id="generos"></div>
